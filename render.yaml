# Render blueprint. Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: ai-link-analysis-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY_HEADERS   # Render terminates TLS and forwards the client IP
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY        # optional: enables source-backed competitor research
        sync: false
